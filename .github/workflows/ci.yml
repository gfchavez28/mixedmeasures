# ─────────────────────────────────────────────────────────────────────────────
# CI — build & test (the foundation workflow)
#
# WHAT IT DOES: on every push to main / every pull request, spins up clean cloud
# Linux machines and runs the same checks you run by hand — backend pytest,
# frontend lint+vitest+build, and the electron unit tests — plus a schema-drift
# gate and advisory dependency audits. No packaging or signing happens here
# (that's the separate release workflow); this is the fast feedback loop.
#
# COST: free on a PUBLIC repo with GitHub-hosted runners. Until the repo is
# public it can still run if Actions is enabled, against the private-repo minute
# allowance.
#
# ✅ ACTIONS SHA-PINNED 2026-06-14. Project policy (ROADMAP "Build pipeline") requires
# every `uses:` action pinned to a FULL COMMIT SHA, never a mutable tag like `@v4`, so a
# compromised upstream tag can't silently alter our build. Each `uses:` below is pinned to
# its release commit SHA with a trailing `# vN` for readability (actions are NOT all on the
# same major — checkout is v7 since 2026-08-02, the others v6). When you intentionally bump
# a major, re-resolve the SHA and update both the pin and the comment:
#     curl -s https://api.github.com/repos/<owner>/<action>/commits/<tag> | grep -m1 '"sha"'
# Cross-check the moving tag against the pointed release (`/commits/v7` and `/commits/v7.0.1`
# must return the SAME sha) — pinning the wrong commit defeats the whole control.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab

# Least privilege: this workflow only reads the repo, never writes to it.
permissions:
  contents: read

# If you push twice quickly, cancel the older in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: pytest + schema-drift gate + production-dep audit ──────────────
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25          # +5 for the R toolchain install (#642)
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"          # matches backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # requirements-dev.txt starts with `-r requirements.txt`, so this single
      # install pulls in production deps + pytest + pip-audit + pyinstaller.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The ONLY check that catches a model edit made without a chained migration:
      # the test suite builds schema via create_all() and never runs the baseline
      # migration, so a drift would pass all tests but break fresh installs.
      # Must run with MM_ENCRYPTION_ENABLED unset (it is, here) — see an internal audit.
      - name: Schema-drift gate (models ↔ baseline migration)
        run: python scripts/schema_diff_harness.py

      # #642: the R oracles are the ONLY external check that the tool's
      # statistics agree with an independent implementation — the whole #402
      # export round-trip and the sole oracle for time-binned kappa. They are
      # skipif-gated on Rscript, and R was installed in NEITHER workflow, so 21
      # tests silently skipped here for months while the run reported green.
      #
      # Ubuntu's own archive is used deliberately over r-lib/actions/setup-r:
      # noble ships r-base-core 4.3.3 — the exact version this project's numbers
      # are anchored to — plus FOUR of the five packages as BINARIES built
      # against it. No new third-party action to SHA-pin, and the r-cran-*
      # binaries are ABI-matched to that R by construction.
      #
      # ⚠️ `irr` is the exception, and assuming otherwise broke this step the
      # first time it ever ran (2026-08-02): **Debian/Ubuntu do not package it**
      # — there is no `r-cran-irr` in any noble component, so apt exited 100 on
      # "Unable to locate package" before a single test ran. It went unnoticed
      # locally because a developer machine gets `irr` from install.packages()
      # into ~/R/..., where the apt name is never exercised. So `irr` comes from
      # CRAN — cheap and safe to do here, because it is PURE R
      # (`NeedsCompilation: no`) and its ONLY dependency is lpSolve, which IS in
      # the archive as a binary. No compiler, no source build of C code.
      #
      # All five packages are required, not just irr: the exported .R bootstraps
      # anything missing with install.packages(), so a gap here turns into a
      # CRAN source build INSIDE a test — slow, network-bound, timeout-prone.
      #
      # The verify line is the point of the whole step: an apt name that does not
      # resolve, or a CRAN install that half-fails, must fail HERE rather than as
      # a confusing MM_REQUIRE_R error two steps later.
      - name: Install R + the correctness-oracle packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-readr r-cran-dplyr r-cran-psych \
            r-cran-ggplot2 r-cran-lpsolve
          sudo Rscript -e 'install.packages("irr", repos = "https://cloud.r-project.org")'
          Rscript -e 'for (p in c("readr","dplyr","psych","ggplot2","irr")) if (!requireNamespace(p, quietly = TRUE)) stop("R oracle package missing: ", p)'

      - name: Tests
        env:
          # Turns "R is missing" from 21 silent skips into one loud failure.
          # See backend/tests/test_r_oracle_availability.py.
          MM_REQUIRE_R: "1"
        run: python -m pytest tests/ -q

      # Advisory here (won't block a push on a freshly-disclosed CVE); the release
      # workflow will run this as a HARD gate before building installers. Scoped to
      # requirements.txt so it audits production deps only, not dev/tooling transitives.
      - name: Dependency audit (production deps)
        run: pip-audit -r requirements.txt
        continue-on-error: true

  # ── Frontend: lint + vitest + production build + dep audit ──────────────────
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "20"              # matches frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci (not install) — strict lockfile install, per project dependency policy.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test                     # = vitest run

      - name: Build
        run: npm run build                # = tsc && vite build

      # Deliberately FULL-TREE (no --omit=dev) and advisory: this surfaces
      # dev-toolchain advisories without blocking normal work. release.yml's
      # hard gate is the scoped one (--omit=dev) — it blocks on what ships.
      # Keep the asymmetry; flattening it either hides dev advisories or blocks
      # every push on them. See #632.
      - name: Dependency audit (full tree, advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

  # ── Electron shell: headless unit tests ─────────────────────────────────────
  electron:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      # Note: electron/ deliberately has no `ignore-scripts`, so npm ci runs
      # electron's postinstall (downloads the runtime binary). The unit tests
      # resolve `require('electron')`, so we keep the download rather than skip it.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test                     # = node --test (the 42 headless tests)
