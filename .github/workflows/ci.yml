# ─────────────────────────────────────────────────────────────────────────────
# CI — build & test (the foundation workflow)
#
# WHAT IT DOES: on pushes to main and pull requests, spins up clean cloud Linux
# machines and runs the same checks you run by hand — backend pytest, frontend
# lint+vitest+build, and the electron unit tests — plus a schema-drift gate and
# the dependency audits. No packaging or signing happens here (that's the
# separate release workflow); this is the fast feedback loop.
#
# WHICH TESTS RUN (#1095): a `plan` job runs first and each area job runs only if
# it says so. The rule: test every area with a change since that area last PASSED
# on this branch, where "change" includes the files OUTSIDE its folder that its
# tests read (`.github/scripts/ci-areas.py` lists them, and the Doc gates workflow
# fails when a test reads one it does not list). Everything runs on a hand-started
# run (the full run RELEASING asks for before a release), on the weekly schedule
# (`ci-weekly.yml`, private only), on a change to this machinery, and always in the
# public repository. The run's summary page says, per area, why it ran or where it
# last passed.
#
# COST: free on a PUBLIC repo with GitHub-hosted runners. On the PRIVATE repo it
# draws on the Free plan's 2,000 minutes a month, which ran out on 2026-09-28 when
# every push ran everything (#1095).
#
# ✅ ACTIONS SHA-PINNED 2026-06-14. Project policy (ROADMAP "Build pipeline") requires
# every `uses:` action pinned to a FULL COMMIT SHA, never a mutable tag like `@v4`, so a
# compromised upstream tag can't silently alter our build. Each `uses:` below is pinned to
# its release commit SHA with a trailing `# vN` for readability (actions are NOT all on the
# same major — checkout is v7 since 2026-08-02, the others v6). When you intentionally bump
# a major, re-resolve the SHA and update both the pin and the comment:
#     curl -s https://api.github.com/repos/<owner>/<action>/commits/<tag> | grep -m1 '"sha"'
# Cross-check the moving tag against the pointed release (`/commits/v7` and `/commits/v7.0.1`
# must return the SAME sha) — pinning the wrong commit defeats the whole control.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
    # A push that changes none of these (notes, plans, ISSUES) starts no run at all — only
    # Doc gates. Each entry must be one of the patterns in ci-areas.py's AREAS, and together
    # they must reach all of them; Doc gates checks both directions.
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'electron/**'
      - '.github/workflows/**'
      - '.github/scripts/ci-areas.py'
      - 'CHANGELOG.md'
      - 'CITATION.cff'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'electron/**'
      - '.github/workflows/**'
      - '.github/scripts/ci-areas.py'
      - 'CHANGELOG.md'
      - 'CITATION.cff'
  # A hand-started run tests EVERY area — RELEASING §3 starts one before every sync:
  #     gh workflow run ci.yml --ref main
  workflow_dispatch:
  # ci-weekly.yml calls this file on a schedule (private repo only), as a full run.
  workflow_call:

# Least privilege: this workflow only reads the repo, never writes to it. The plan job
# alone adds `actions: read`, to find where each area last passed.
permissions:
  contents: read

# If you push twice quickly, cancel the older in-flight run for the same ref. Safe with the
# plan: the cancelled run's areas never PASSED, so the newer run tests them. The event is in
# the group so a push never cancels the weekly or a hand-started full run, nor they a push.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ── Plan: which areas this run tests (#1095) ─────────────────────────────────
  plan:
    runs-on: ubuntu-24.04   # pinned like every job here (#1097); see `backend`
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read         # earlier CI runs: where each area last passed
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      electron: ${{ steps.plan.outputs.electron }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0        # every commit: the diff runs from each area's last pass
          filter: blob:none     # but no file contents, which a list of changed paths never needs

      # Standard-library Python on the runner's own interpreter; nothing to install. Any
      # failure to decide plans EVERY area, with a warning saying why.
      - name: Decide which areas this run tests
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci-areas.py plan

  # ⚠️ Each area job runs UNLESS the plan says exactly `false`, so a plan that crashed (no
  # outputs) tests everything — the fail-safe direction. `!cancelled()` lets a failed plan
  # still reach them. Doc gates fails if a job's condition loses either half.
  # ── Backend: pytest + schema-drift gate + production-dep audit ──────────────
  backend:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.backend != 'false' }}
    # PINNED, never ubuntu-latest (#1097): the R oracles are anchored to noble's R 4.3.3,
    # and ubuntu-latest moves to 26.04 over 2026-10-19 → 11-19, where every apt name below
    # still resolves — to R 4.5.2. The install step now ASSERTS the version too. Moving off
    # 24.04 is a deliberate re-anchor, made here and in release.yml's verify job together.
    # Never ubuntu-22.04: it preinstalls CRAN R 4.6.1, which apt will not downgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 25          # +5 for the R toolchain install (#642)
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"          # matches backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # requirements-dev.txt starts with `-r requirements.txt`, so this single
      # install pulls in production deps + pytest + pip-audit + pyinstaller.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The ONLY check that catches a model edit made without a chained migration:
      # the test suite builds schema via create_all() and never runs the baseline
      # migration, so a drift would pass all tests but break fresh installs.
      # Must run with MM_ENCRYPTION_ENABLED unset (it is, here) — see an internal audit.
      - name: Schema-drift gate (models ↔ baseline migration)
        run: python scripts/schema_diff_harness.py

      # #642: the R oracles are the ONLY external check that the tool's
      # statistics agree with an independent implementation — the whole #402
      # export round-trip and the sole oracle for time-binned kappa. They are
      # skipif-gated on Rscript, and R was installed in NEITHER workflow, so 21
      # tests silently skipped here for months while the run reported green.
      #
      # Ubuntu's own archive is used deliberately over r-lib/actions/setup-r:
      # noble ships r-base-core 4.3.3 — the exact version this project's numbers
      # are anchored to — plus FOUR of the five packages as BINARIES built
      # against it. No new third-party action to SHA-pin, and the r-cran-*
      # binaries are ABI-matched to that R by construction.
      #
      # ⚠️ `irr` is the exception, and assuming otherwise broke this step the
      # first time it ever ran (2026-08-02): **Debian/Ubuntu do not package it**
      # — there is no `r-cran-irr` in any noble component, so apt exited 100 on
      # "Unable to locate package" before a single test ran. It went unnoticed
      # locally because a developer machine gets `irr` from install.packages()
      # into ~/R/..., where the apt name is never exercised. So `irr` comes from
      # CRAN — cheap and safe to do here, because it is PURE R
      # (`NeedsCompilation: no`) and its ONLY dependency is lpSolve, which IS in
      # the archive as a binary. No compiler, no source build of C code.
      #
      # All five packages are required, not just irr: the exported .R bootstraps
      # anything missing with install.packages(), so a gap here turns into a
      # CRAN source build INSIDE a test — slow, network-bound, timeout-prone.
      #
      # The verify line is the point of the whole step: an apt name that does not
      # resolve, or a CRAN install that half-fails, must fail HERE rather than as
      # a confusing MM_REQUIRE_R error two steps later.
      # ⚠️ STEP-LEVEL TIMEOUT, and it is the point of #781 rather than a tidy-up.
      # Twice now (2026-08-14, 2026-08-19) this step consumed the JOB's entire
      # budget fetching apt packages. A job-level timeout CANCELS the running
      # step and SKIPS every step after it, so the run reads `cancelled` — which
      # looks like a human stopped it — while `Tests` and the HARD dependency
      # gate below never executed. Green by appearance, two gates dark.
      #
      # A step-level timeout makes the STEP fail instead, so the run reads
      # `failure` and names this step. The suite still does not run, but "the
      # tests did not run" is now LOUD, which is the requirement #781 is about.
      #
      # 10 minutes is generous against the ~5 the job budget was widened by for
      # this install (#642); raise it if a legitimately slow mirror trips it.
      - name: Install R + the correctness-oracle packages
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-readr r-cran-dplyr r-cran-psych \
            r-cran-ggplot2 r-cran-lpsolve
          # #1097: the anchor is ASSERTED, not assumed from the runner label — the label is
          # what moves. getRversion() ignores the Debian revision, so a 4.3.3 rebuild passes.
          Rscript -e 'v <- getRversion(); if (v != "4.3.3") stop("R ", v, " is installed; the R oracles are anchored to 4.3.3")'
          sudo Rscript -e 'install.packages("irr", repos = "https://cloud.r-project.org")'
          Rscript -e 'for (p in c("readr","dplyr","psych","ggplot2","irr")) if (!requireNamespace(p, quietly = TRUE)) stop("R oracle package missing: ", p)'

      - name: Tests
        env:
          # Turns "R is missing" from 21 silent skips into one loud failure.
          # See backend/tests/test_r_oracle_availability.py.
          MM_REQUIRE_R: "1"
        run: python -m pytest tests/ -q

      # HARD gate since 2026-08-09 (was advisory). Scoped to requirements.txt so it
      # audits production deps only, not dev/tooling transitives.
      #
      # Why promote it: release.yml runs the IDENTICAL command as a blocking gate, so
      # advisory-here only ever meant "learn at cut time instead of at push". A
      # freshly-disclosed CVE in a shipping dep could sit on main, green, until
      # someone tried to release. Given the policy is to patch security promptly, the
      # earlier signal is the whole point.
      #
      # ⚠️ Accepted cost, stated so it is not re-litigated as flakiness: this queries
      # the PyPI advisory DB, so a network blip now reddens CI. release.yml already
      # carries that exposure; taking it here too is the deliberate trade.
      #
      # Placement is load-bearing: LAST in the job, after Tests. A failing step halts
      # the ones after it, so an audit placed earlier would cost the test signal on
      # exactly the runs you most want it.
      #
      # ⚠️ `!cancelled()` removes the REVERSE coupling, and it is #781's other half.
      # Being last means every earlier failure — a slow R install, a red test —
      # used to skip this gate too, so a push could land on `main` with its
      # production dependencies never audited. The condition keeps the placement
      # (a failing audit still cannot cost the test signal) while letting the gate
      # run anyway. `!cancelled()` rather than `always()` on purpose: a run someone
      # deliberately cancels should stop, not spend a minute querying PyPI.
      #
      # ⚠️ This is DELIBERATELY NOT mirrored in release.yml — see the note there.
      - name: Dependency audit (HARD gate, production deps)
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements.txt

  # ── Frontend: lint + vitest + production build + dep audit ──────────────────
  frontend:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.frontend != 'false' }}
    runs-on: ubuntu-24.04   # pinned like every job here (#1097); see `backend`
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "24"              # matches frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci (not install) — strict lockfile install, per project dependency policy.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test                     # = vitest run

      - name: Build
        run: npm run build                # = tsc && vite build

      # TWO audits, and the pair is the point — do not collapse them into one.
      #
      # (1) FULL-TREE, advisory: surfaces dev-toolchain advisories without blocking
      #     normal work. Flattening this either hides dev advisories or blocks every
      #     push on them. See #632. It runs FIRST and cannot fail the job, so its
      #     output is always printed — even on a run the gate below then fails.
      - name: Dependency audit (full tree, advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

      # (2) PRODUCTION-SCOPED, hard gate — added 2026-08-09, identical to the
      #     release.yml gate. Without it `ci.yml` had no production-dep check at all
      #     on the frontend: a CVE in a SHIPPING dep passed every push and surfaced
      #     only when someone tried to cut. --omit=dev is load-bearing (see #632).
      #
      # ⚠️ `!cancelled()` for the same reason as the backend gate (#781): a lint,
      # test or build failure would otherwise skip this, leaving the push's
      # dependency posture simply unanswered. MEASURED rather than assumed:
      # `npm audit --omit=dev` reads `package-lock.json` and needs no
      # `node_modules` — run in a directory holding only the two manifests it
      # returns "found 0 vulnerabilities", exit 0 — so it does not cascade-fail
      # even when `npm ci` is what broke.
      #
      # ⛔ Deliberately NOT applied to the ADVISORY audit above: it is
      # `continue-on-error` and non-blocking, so its skipping costs nothing. The
      # rule is "hard gates always run, advisory ones are best-effort".
      - name: Dependency audit (HARD gate, production deps)
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high

  # ── Electron shell: headless unit tests ─────────────────────────────────────
  electron:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.electron != 'false' }}
    runs-on: ubuntu-24.04   # pinned like every job here (#1097); see `backend`
    timeout-minutes: 15
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "24"              # matches electron/.nvmrc
          cache: npm
          cache-dependency-path: electron/package-lock.json

      # Note: `electron/.npmrc` sets `ignore-scripts=true` (#562a, 2026-07-11), so
      # npm ci runs NO lifecycle scripts here. That is a no-op today rather than a
      # behaviour change — the tree declares zero install scripts (no
      # `hasInstallScript` entry in electron/package-lock.json, and electron@42's
      # own package.json declares no `scripts` at all; its binary is fetched by
      # electron-builder/@electron/get at BUILD time, not by a postinstall). The
      # headless unit tests are pure modules (backend-process / key-manager / zoom /
      # fatal-error / updater) and never `require('electron')`, so no runtime
      # download is needed for them.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test                     # = node --test (106 headless cases)

      # Added 2026-08-09. electron/ had NO dependency audit in ci.yml at all, and it
      # is the job where that gap actually bit: #720 was a red PRODUCTION gate here
      # (js-yaml, via electron-updater) discovered while trying to cut a release —
      # the precise failure this catches one push earlier. Identical command to the
      # release.yml gate so the two can never disagree.
      #
      # --omit=dev is load-bearing (#547), and here is the MEASURED reason rather
      # than an assertion (2026-08-09): this tree's FULL audit reports
      # `17 vulnerabilities (1 moderate, 15 high, 1 critical)` and exits 1, while
      # `--omit=dev` exits 0. Every one of the 17 is the dev-only
      # electron-builder/tar/node-gyp chain that policy says to DISMISS, never
      # `--force` — so a full-tree gate here would fail literally every run and be
      # switched off within a week. electron ships exactly ONE runtime dep
      # (electron-updater, #29 S2), which is what this gate exists to watch.
      #
      # ⚠️ `!cancelled()` for the same reason as the other two hard gates (#781) —
      # a unit-test failure must not leave the shipping dep unaudited. The command
      # reads the lockfile, so it does not depend on `npm ci` having succeeded.
      - name: Dependency audit (HARD gate, production deps)
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high

      # #1094: the shipped RUNTIME, which every audit above skips (`electron` is a
      # devDependency, so --omit=dev drops it by construction) and which the global advisory
      # database has missed before: six Electron advisories of 2026-08-29 returned 404 there
      # while four named the 42.8.1 that v1.5.3 and v1.5.4 shipped (#1093). This reads
      # Electron's OWN published advisories and fails when the locked version is in a range
      # nobody has reviewed (the script's REVIEWED list, each entry with its reason). Replayed
      # 2026-10-06: on 42.8.1 it names exactly those four. Network-bound like the audits.
      - name: Electron runtime advisories (HARD gate, the shipped runtime)
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/electron-advisories.js
